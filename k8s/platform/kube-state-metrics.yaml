# kube-state-metrics (official image, stable): Kubernetes object state as metrics.
# Limited to pods, the only source the bridge needs (restarts, waiting reasons such
# as CrashLoopBackOff), so its RBAC is read-only list/watch on pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-kube-state-metrics
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: platform

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        args: ["--resources=pods"]
        ports:
        - name: http-metrics
          containerPort: 8080
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        livenessProbe:
          httpGet: {path: /livez, port: 8080}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: platform
spec:
  selector:
    app: kube-state-metrics
  ports:
  - name: http-metrics
    port: 8080
    targetPort: 8080
